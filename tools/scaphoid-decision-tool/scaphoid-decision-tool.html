<title>腕舟骨骨折 / 不愈合 / SNAC 决策工具</title>
<style>
:root{--ink:#102a43;--muted:#627d98;--line:#d9e2ec;--bg:#f5f8fb;--card:#fff;--blue:#1769aa;--deep:#0b4f6c;--teal:#087f8c;--amber:#b7791f;--red:#b42318;--soft:#eaf4fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:30px 20px 56px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:27px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:0 0 8px}h3{font-size:16px;margin:18px 0 7px}.sub,.muted{color:var(--muted)}.legal{margin:18px 0;padding:12px 15px;border-left:4px solid var(--amber);background:#fffaf0;color:#664c18;font-size:13px}.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}.scene{display:flex;flex-direction:column;min-height:215px;padding:22px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;text-align:left;transition:.15s}.scene:hover{border-color:var(--blue);box-shadow:0 7px 20px #102a4314;transform:translateY(-2px)}.scene .letter{color:var(--blue);font-weight:700;font-size:13px}.scene h2{margin-top:7px}.scene p{margin:0;color:var(--muted)}.scene span:last-child{margin-top:auto;color:var(--blue);font-weight:600}.wizard{display:none}.wizard.active{display:block}.topline{display:flex;align-items:center;gap:13px;margin:20px 0}.tag{background:var(--soft);color:var(--blue);font-size:13px;font-weight:700;padding:3px 9px;border-radius:20px}.progress{display:flex;gap:5px;flex:1}.dot{height:6px;background:#cbd5e1;border-radius:10px;flex:1}.dot.on{background:var(--teal)}.step{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}.step.active{display:block}.step-title{margin:0 0 4px;font-size:22px}.helper{color:var(--muted);margin:0 0 20px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.field{border-bottom:1px solid #edf2f7;padding-bottom:13px}.field.full{grid-column:1/-1}.label{font-weight:650;display:block;margin-bottom:7px}.note{display:block;color:var(--muted);font-size:12px;margin:-3px 0 8px}.options{display:flex;flex-wrap:wrap;gap:7px}.options label{border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer;background:#fff;font-size:13px}.options label:has(input:checked){border-color:var(--blue);color:var(--blue);background:#f0f8ff;font-weight:650}input[type=radio],input[type=checkbox]{accent-color:var(--blue);margin-right:4px}input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit}textarea{min-height:70px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.btn{appearance:none;border:1px solid var(--blue);border-radius:7px;background:var(--blue);color:white;padding:9px 14px;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:white;color:var(--blue)}.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}.result{display:none;margin-top:20px}.result.active{display:block}.resulthead{display:flex;justify-content:space-between;gap:12px;align-items:center}.resultbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}.risk{border-radius:8px;padding:10px 12px;margin:14px 0}.risk.low{background:#edf7f1;color:#216b45}.risk.mid{background:#fff7e6;color:#8a5a12}.risk.high{background:#fff0f0;color:var(--red)}.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rec{border:1px solid var(--line);border-radius:9px;padding:14px}.rec.primary{border-top:4px solid var(--teal)}.rec.alt{border-top:4px solid var(--blue)}.rec h3{margin:0 0 7px}.rec ul,.checks ul{margin:7px 0 0;padding-left:20px}.why{background:#f7fbfd;border-radius:8px;padding:13px 15px;margin-top:16px}.avoid{border-left:4px solid var(--red);padding:7px 0 7px 12px;margin-top:15px}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.checks{border:1px solid var(--line);border-radius:8px;padding:13px}.footer-note{font-size:12px;color:var(--muted);margin-top:20px}.hidden{display:none!important}@media(max-width:720px){.scene-grid,.fields,.rec-grid,.checklist{grid-template-columns:1fr}.wrap{padding:20px 13px}header{display:block}.actions{justify-content:space-between}.resulthead{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap">
<header><div><h1>腕舟骨骨折 / 不愈合 / SNAC 决策工具</h1><div class="sub">临床快速分流 · Scaphoid fracture, nonunion &amp; SNAC decision support</div></div><button class="btn ghost" onclick="resetAll()">重置全部</button></header>
<div class="legal"><strong>临床决策支持声明：</strong>本工具仅用于梳理主流手外科决策框架，不替代完整查体、规范 X 线/薄层 CT/MRI（必要时增强）/关节镜评估、患者共同决策或手外科/显微外科会诊。MRI 单一信号（如 T1 低、T2 高）不能单独等同于 AVN；须结合形态、增强表现、CT 骨结构及术中出血情况判断。</div>
<section id="home"><h2>选择当前临床场景</h2><div class="scene-grid">
<button class="scene" onclick="start('acute')"><span class="letter">A · Acute</span><h2>急性舟骨骨折</h2><p>新近受伤，评估骨折部位、稳定性、移位与高风险近端极。</p><span>开始评估 →</span></button>
<button class="scene" onclick="start('nonunion')"><span class="letter">B · Nonunion</span><h2>舟骨骨折不愈合</h2><p>未出现明显塌陷或广泛关节炎，重点判断重建难度与血供。</p><span>开始评估 →</span></button>
<button class="scene" onclick="start('snac')"><span class="letter">C · Collapse / SNAC</span><h2>不愈合伴坏死塌陷 / SNAC</h2><p>按软骨受累分布、腕骨力线与功能需求选择保留或挽救方案。</p><span>开始评估 →</span></button>
</div></section>
<section id="wizard" class="wizard"><div class="topline"><button class="btn ghost" onclick="goHome()">← 更换场景</button><span id="sceneTag" class="tag"></span><div id="progress" class="progress"></div></div><div id="steps"></div><section id="result" class="result"></section></section>
</main>
<script>
const configs={
acute:{name:'A · 急性舟骨骨折',steps:[
{title:'症状、体征与时间',help:'先确认临床怀疑程度与延迟诊断风险。',fields:[['age','年龄（岁）','number'],['demand','功能/负荷需求','radio',['一般日常','重体力/运动/需快速回归']],['injury','受伤至今','radio',['≤2 周','2–6 周','>6 周 / 延迟诊断']],['exam','体征','check',['鼻烟窝压痛','舟骨结节压痛','拇指轴向叩痛','疼痛轻微/体征不典型']]]},
{title:'基础影像与骨折形态',help:'规范舟骨位 X 线阴性而临床怀疑高时，优先 CT 或早期 MRI。',fields:[['site','骨折部位','radio',['远端极','腰部','近端极']],['displace','CT/X 线移位','radio',['无或 <1 mm','≥1 mm','未行 CT / 不确定']],['pattern','不稳定征象','check',['骨折间隙/成角','humpback 倾向','DISI / SL 角异常','垂直斜形骨折']],['comminuted','是否粉碎','radio',['无','轻度','明显/关节面受累']]]},
{title:'伴随损伤与检查完整性',help:'近端极、移位、粉碎和韧带损伤会显著提高不愈合风险。',fields:[['ligament','合并韧带/腕骨损伤','radio',['未见','可疑','明确（SL/其他腕骨骨折脱位）']],['ct','薄层 CT（舟骨轴位重建）','radio',['已完成','未完成/建议补充']],['mri','MRI 需求','radio',['已完成','无需常规 MRI','X 线/CT 不确定或疑韧带/隐匿损伤']],['symptom','当前疼痛及功能影响','radio',['轻，日常可耐受','中度，握力/活动受限','重，工作或支撑明显受限']]]}
]},
nonunion:{name:'B · 舟骨骨折不愈合（未明显塌陷/关节炎）',steps:[
{title:'病史、症状与目标',help:'不愈合本身需结合疼痛、力线和可重建性，而不是只看病程。',fields:[['age','年龄（岁）','number'],['duration','骨折至今','radio',['<6 月','6–12 月','>12 月']],['symptom','症状/功能影响','radio',['轻，偶发负荷痛','中度，握力或活动受限','重，持续疼痛/影响工作']],['demand','功能/负荷需求','radio',['一般日常','重体力/运动/需快速回归']]]},
{title:'CT：机械重建条件',help:'应采用薄层 CT + scaphoid-axis 重建；评估间隙、硬化、缺损、长度和力线。',fields:[['site','骨折部位','radio',['远端极','腰部','近端极']],['defect','骨缺损 / 硬化','radio',['小，无明显硬化','中等，可清创后填补','大，硬化/囊变明显']],['hump','humpback / 舟骨短缩','radio',['无','轻-中度','明显']],['disi','DISI / 腕骨力线','radio',['无','可疑/轻度','明确']],['arthritis','关节软骨/关节炎','radio',['未见明显','局灶可疑','明确退变（转 SNAC 路径）']]]},
{title:'血供与复杂性',help:'增强 MRI 可辅助；近端极形态、CT 骨量与术中点状出血同样关键。',fields:[['vascular','近端骨块血供/坏死证据','radio',['无明显异常','不确定 / 仅非特异 MRI 信号','高度可疑 AVN（增强缺乏/形态塌陷）']],['fragment','近端骨块骨量/形态','radio',['足够固定','偏小但可能固定','很小、碎裂或难以固定']],['prior','既往治疗','radio',['初次处理','既往固定失败/植骨失败']],['ct','薄层 CT','radio',['已完成','未完成/建议补充']],['mri','增强 MRI / 血供评估','radio',['已完成','尚未完成/若血供不明建议补充']]]}
]},
snac:{name:'C · 不愈合伴坏死塌陷 / SNAC',steps:[
{title:'症状、功能与意愿',help:'症状与影像并不完全平行；影像异常不是单独做挽救术的理由。',fields:[['age','年龄（岁）','number'],['symptom','疼痛与功能影响','radio',['轻，主要负荷/掌撑痛','中度，日常或工作受限','重，持续痛/严重功能障碍']],['demand','功能/负荷需求','radio',['一般日常','重体力/高需求','明确偏好最大活动度/避免融合']],['duration','病史','radio',['<1 年','1–5 年','>5 年 / 长期陈旧']]]},
{title:'结构与力线',help:'薄层 CT 用于量化近端残余骨量、塌陷、舟骨短缩、DISI 与腕高。',fields:[['site','原骨折部位','radio',['远端极','腰部','近端极']],['fragment','近端骨块及软骨下骨','radio',['形态保存、可固定','缩小/塌陷但可能重建','明显塌陷、碎裂或不可固定']],['defect','骨缺损 / humpback','radio',['小或无','中等','大/明显短缩']],['disi','DISI / 腕骨塌陷/舟头近移','radio',['无明显','轻-中度','明显']],['vascular','血供/AVN 证据','radio',['不确定或仅 MRI 信号改变','可疑','高度可疑（增强/CT形态支持）']]]},
{title:'软骨地图与 SNAC 分流',help:'必要时关节镜 cartilage mapping；重点区分 radioscaphoid、capitate 头及 lunate fossa。',fields:[['cartilage','关节软骨受累部位','radio',['局限桡骨茎突—舟骨远端','累及 radioscaphoid / scaphocapitate，capitolunate 保存','capitolunate 受累','radiolunate / lunate fossa 或 capitate 头受累']],['stage','SNAC 分期（若已判定）','radio',['未判定','I（桡骨茎突—舟骨）','II（+ scaphocapitate）','III（+ capitolunate）','广泛/终末期']],['ct','薄层 CT + 腕骨力线','radio',['已完成','未完成/建议补充']],['scope','关节镜软骨评估','radio',['已完成','尚未完成/软骨分布不清时建议']]]}
]}
};
let scene='',idx=0,data={};
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function start(s){scene=s;idx=0;data={};document.getElementById('home').classList.add('hidden');document.getElementById('wizard').classList.add('active');document.getElementById('sceneTag').textContent=configs[s].name;render()}
function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('wizard').classList.remove('active');document.getElementById('result').classList.remove('active')}
function resetAll(){scene='';idx=0;data={};goHome()}
function field([key,label,type,opts]){let val=data[key]||'';if(type==='number')return `<div class="field"><label class="label">${label}</label><input data-key="${key}" type="number" min="0" max="110" placeholder="请输入" value="${esc(val)}"></div>`;let isCheck=type==='check';return `<div class="field ${isCheck?'full':''}"><span class="label">${label}</span><div class="options">${opts.map(o=>`<label><input data-key="${key}" type="${isCheck?'checkbox':'radio'}" name="${key}" value="${o}" ${isCheck?(Array.isArray(val)&&val.includes(o)?'checked':''):(val===o?'checked':'')}>${o}</label>`).join('')}</div></div>`}
function render(){let c=configs[scene],st=c.steps[idx];document.getElementById('progress').innerHTML=c.steps.map((_,i)=>`<span class="dot ${i<=idx?'on':''}"></span>`).join('');document.getElementById('steps').innerHTML=`<section class="step active"><div class="muted">第 ${idx+1} / ${c.steps.length} 步</div><h2 class="step-title">${st.title}</h2><p class="helper">${st.help}</p><div class="fields">${st.fields.map(field).join('')}</div><div class="actions">${idx?'<button class="btn secondary" onclick="back()">← 返回上一步</button>':'<span></span>'}<button class="btn" onclick="next()">${idx===c.steps.length-1?'生成决策建议':'下一步 →'}</button></div></section>`;document.querySelectorAll('#steps input').forEach(x=>x.addEventListener('change',save));document.querySelectorAll('#steps input[type=number]').forEach(x=>x.addEventListener('input',save))}
function save(e){let x=e.target,k=x.dataset.key;if(x.type==='checkbox'){data[k]=[...document.querySelectorAll(`input[data-key="${k}"]:checked`)].map(i=>i.value)}else data[k]=x.value}
function back(){idx--;render()}function next(){if(idx<configs[scene].steps.length-1){idx++;render()}else showResult()}
function has(k,v){return data[k]===v}function includes(k,v){return (data[k]||[]).includes(v)}
function bullet(a){return '<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function assessment(){
  let a=[],risk='low',label='可先采取相对保守的分流策略';
  if(scene==='acute'){
    const high=has('site','近端极')||has('displace','≥1 mm')||has('comminuted','明显/关节面受累')||has('ligament','明确（SL/其他腕骨骨折脱位）')||includes('pattern','DISI / SL 角异常')||has('injury','>6 周 / 延迟诊断');
    if(high){risk='high';label='不愈合/失稳风险较高：优先手外科评估固定可行性'}
    else if(has('injury','2–6 周')||has('displace','未行 CT / 不确定')||has('ligament','可疑')){risk='mid';label='需完成 CT/稳定性分层后决定'}
    else label='形态相对稳定：保守固定是合理起点';
    a=['临床高度怀疑但初始 X 线阴性时，不宜以“片子阴性”排除；安排 CT 或 MRI。','记录鼻烟窝/结节压痛、握力、伸屈与旋前旋后，并在复诊中追踪。'];
  }else if(scene==='nonunion'){
    const complex=has('site','近端极')||has('vascular','高度可疑 AVN（增强缺乏/形态塌陷）')||has('fragment','很小、碎裂或难以固定')||has('defect','大，硬化/囊变明显')||has('hump','明显')||has('disi','明确')||has('prior','既往固定失败/植骨失败');
    if(complex){risk='high';label='复杂重建风险高：建议显微/高容量手外科评估'}
    else if(has('vascular','不确定 / 仅非特异 MRI 信号')||has('defect','中等，可清创后填补')||has('hump','轻-中度')||has('disi','可疑/轻度')){risk='mid';label='存在结构或血供不确定性：需精确规划重建'}
    else label='机械条件相对有利：可优先考虑常规重建';
    a=['非血管化植骨适用于血供、骨量和固定条件可接受的不愈合；关键是彻底清创、纠正长度/成角并获得稳定固定。','AVN 的判断须综合增强 MRI、CT 形态、近端骨块大小与术中点状出血，不能以单一 MRI 信号定性。'];
  }else{
    const adv=has('cartilage','capitolunate 受累')||has('cartilage','radiolunate / lunate fossa 或 capitate 头受累')||has('stage','III（+ capitolunate）')||has('stage','广泛/终末期')||has('disi','明显');
    if(adv){risk='high';label='中腕/广泛软骨受累：倾向挽救性重建分流'}
    else if(has('fragment','缩小/塌陷但可能重建')||has('cartilage','累及 radioscaphoid / scaphocapitate，capitolunate 保存')||has('stage','II（+ scaphocapitate）')||has('symptom','中度，日常或工作受限')){risk='mid';label='局部塌陷/退变：需以软骨地图决定“重建”还是“挽救”'}
    else label='局限早期 SNAC 且症状可接受：非手术或有限减痛治疗可行';
    a=['SNAC 的手术分流以软骨分布为核心：capitate 头与 lunate fossa 软骨质量决定 PRC 是否可用；capitolunate 软骨状况决定四角融合的适配性。','影像塌陷程度与疼痛可不一致；轻症患者可观察，并以症状和功能变化作为升级治疗触发点。'];
  }
  return {a,risk,label};
}
function decision(){
  let p=[],alt=[],tests=[],ref=[],avoid=[]; const x=assessment();
  if(scene==='acute'){
    const high=x.risk==='high';
    if(!high){p=['短臂拇指石膏或支具固定（通常 6–10 周，依部位与 CT 愈合调整）。','早期复查临床体征；以 CT 评估骨性愈合，而非仅凭无痛或普通 X 线。'];alt=['对高功能需求、希望缩短固定期且骨折形态适合者：经皮空心螺钉固定可作为共同决策选项。'];tests=['薄层 CT（0.5–1 mm，舟骨长轴重建）确认移位/粉碎。','X 线阴性但临床高度怀疑：MRI 用于隐匿骨折及伴随软组织损伤评估。'];}
    else{p=['优先转手外科评估经皮或开放复位内固定（通常空心螺钉），必要时植骨。','近端极或明显移位/粉碎者：更倾向开放复位，以直接恢复长度、旋转和关节面关系。'];alt=['若因患者因素暂不能手术：严格固定并尽快复评；此路线不应替代对失稳骨折的手术评估。'];tests=['薄层 CT 明确骨折线与固定规划。','疑 SL 韧带或腕骨不稳：补充 MRI/关节镜评估。'];ref=['近端极骨折、≥1 mm 移位、粉碎、骨折脱位或明确韧带损伤。'];avoid=['不宜把“普通 X 线看起来不明显”作为停止评估的依据。','高度不稳或近端极骨折不宜仅因症状可耐受而长期松散观察。'];}
  } else if(scene==='nonunion'){
    const complex=x.risk==='high';
    if(!complex){p=['清创不愈合端 + 纠正舟骨长度/成角 + 非血管化植骨（NVBG）+ 稳定螺钉固定。','腰部缺损且需恢复舟骨长度时，可选择结构性皮质松质植骨（例如嵌压楔形植骨），按术者经验制定。'];alt=['血供不明确、近端骨块偏小或既往失败：将血管化骨移植（VBG）作为升级选择。'];tests=['薄层 CT 定量缺损、humpback、DISI 与近端骨块尺寸。','血供不明或近端极受累：增强 MRI；术中观察点状出血。'];}
    else{p=['在显微/复杂舟骨重建经验团队中评估血管化骨移植 + 固定；常用局部带蒂血管化骨瓣（如 1,2-ICSRA）或游离血管化移植。','近端极很小、既往失败、骨量严重缺失或需重建关节面支撑时，评估游离内侧股骨髁（MFC）血管化骨/骨软骨移植等复杂重建。'];alt=['若症状轻、关节面对线与力线尚可：短期观察、负荷调整与随访可作为过渡；须说明力线恶化或症状加重时应升级。'];tests=['薄层 CT + 舟骨轴重建（近端极厚度、软骨下骨、缺损、DISI）。','增强 MRI 仅作为血供证据之一；必要时关节镜评估软骨。'];ref=['近端极 AVN 高度可疑、骨块难固定、既往植骨/固定失败、明显 humpback/DISI 或缺损大。'];avoid=['近端骨块明显碎裂、软骨下骨塌陷或无法提供螺钉抓持时，不宜将常规 NVBG + 螺钉当作低风险方案。','已明确中腕/广泛关节炎时，不宜把单纯骨愈合重建作为首选，应转 SNAC 分流。'];}
  } else {
    const early=x.risk==='low',terminal=has('cartilage','radiolunate / lunate fossa 或 capitate 头受累')||has('stage','广泛/终末期');
    if(early){p=['观察与症状治疗：负荷调整、护腕、短期镇痛抗炎、必要时注射；以疼痛、握力与功能作为随访终点。','局限桡骨茎突撞击且疼痛明确者：评估有限桡骨茎突切除（radial styloidectomy，谨慎保留稳定性）和/或腕去神经（denervation）以减痛。'];alt=['若 CT/关节镜显示近端骨块仍可固定、软骨总体保存且患者愿意承担复杂重建：在高容量团队讨论舟骨重建（常需血管化骨移植/复杂植骨）。'];tests=['薄层 CT 量化塌陷、舟骨短缩、DISI、腕高与舟头近移。','关节镜 cartilage mapping，明确 capitate 头、lunate fossa、capitolunate 软骨。'];}
    else if(!terminal && has('cartilage','累及 radioscaphoid / scaphocapitate，capitolunate 保存')){p=['症状性 SNAC II 且 capitolunate 软骨保存：scaphoidectomy + four-corner fusion（四角融合）是常用挽救方案。','根据患者症状与退变范围，也可讨论去神经作为保留活动度的减痛过渡方案。'];alt=['PRC（近排腕骨切除）仅在 capitate 头及 lunate fossa 软骨保存良好时考虑；需通过关节镜/术中评估确认。','若近端骨块和软骨面仍具可靠重建条件，复杂舟骨重建可在特定患者讨论，但塌陷和退变越明显，获益越不确定。'];tests=['关节镜确认 capitate 头与 lunate fossa 软骨是否适合 PRC。','CT 评估 capitolunate 受累及腕骨力线。'];avoid=['capitolunate 关节炎明显时，四角融合通常不合适。','capitate 头或 lunate fossa 软骨受损时，不宜常规 PRC。'];}
    else{p=['若为终末期/广泛关节炎、持续疼痛且功能严重受限：全腕融合（total wrist arthrodesis）提供最可靠的减痛与承重稳定性。','如 radiolunate/lunate fossa 或 capitate 头软骨受累，PRC 的失败风险升高；需优先在手外科讨论可行的挽救方案。'];alt=['特定低负荷、关节面条件允许者可讨论其他保留活动度方案；这需要专科影像、关节镜及患者目标共同决定。'];tests=['完整腕关节 X 线（负重/动态视需要）+ 薄层 CT；关节镜用于软骨地图。','评估工作负荷、对活动度与承重的优先级，以及对融合后功能的接受度。'];ref=['SNAC III、广泛退变、radiolunate 受累、明显腕骨塌陷或任何拟行 PRC/四角融合/全腕融合的患者。'];avoid=['capitate 头或 lunate fossa 软骨不佳时不宜 PRC。','capitolunate 软骨破坏时不宜四角融合。','症状很轻且软骨受累局限时，不宜仅因 X 线异常仓促行 PRC、四角融合或全腕融合。'];}
  }
  return {p,alt,tests,ref,avoid,x};
}
function showResult(){let d=decision(),x=d.x;let summary=`腕舟骨决策摘要\n场景：${configs[scene].name}\n\n录入要点：\n${Object.entries(data).map(([k,v])=>`${k}：${Array.isArray(v)?v.join('、'):v||'未填'}`).join('\n')}\n\n首选策略：\n${d.p.map(i=>'• '+i).join('\n')}\n\n备选策略：\n${d.alt.map(i=>'• '+i).join('\n')}\n\n建议检查：\n${d.tests.map(i=>'• '+i).join('\n')}\n\n说明：\n${x.a.map(i=>'• '+i).join('\n')}`;window.currentSummary=summary;document.getElementById('steps').innerHTML='';let ref=d.ref.length?`<div class="checks"><h3>建议转手外科 / 显微外科评估</h3>${bullet(d.ref)}</div>`:'';let avoid=d.avoid.length?`<div class="avoid"><strong>不宜直接采用的路径 / 重要限制</strong>${bullet(d.avoid)}</div>`:'';document.getElementById('result').className='result active';document.getElementById('result').innerHTML=`<div class="resultbox"><div class="resulthead"><div><div class="tag">${configs[scene].name}</div><h2 style="margin-top:8px">决策建议</h2></div><div class="actions" style="margin:0"><button class="btn secondary" onclick="copySummary()">复制摘要</button><button class="btn" onclick="exportSummary()">导出摘要</button></div></div><div class="risk ${x.risk}"><strong>${x.label}</strong></div><div class="rec-grid"><div class="rec primary"><h3>首选策略</h3>${bullet(d.p)}</div><div class="rec alt"><h3>备选策略</h3>${bullet(d.alt)}</div></div><div class="why"><strong>为什么这样分流</strong>${bullet(x.a)}</div><div class="checklist"><div class="checks"><h3>建议进一步检查</h3>${bullet(d.tests)}</div>${ref||'<div class="checks"><h3>何时升级专科评估</h3><ul><li>疼痛、握力、活动度或工作能力持续恶化。</li><li>复查提示不愈合、力线失代偿或关节炎进展。</li></ul></div>'}</div>${avoid}<p class="footer-note">本摘要仅为临床决策支持。术式适配性仍取决于查体、完整影像、软骨状态、患者目标与术者经验；请勿将此结果作为独立诊疗结论。</p><div class="actions"><button class="btn secondary" onclick="idx=configs[scene].steps.length-1;document.getElementById('result').classList.remove('active');render()">← 修改最后一步</button><button class="btn ghost" onclick="resetAll()">重新开始</button></div></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function copySummary(){try{await navigator.clipboard.writeText(window.currentSummary);alert('决策摘要已复制。')}catch(e){alert('复制失败，请使用“导出摘要”。')}}function exportSummary(){let b=new Blob([window.currentSummary],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='腕舟骨决策摘要.txt';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
